<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NordLife RP</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#050505;color:white}
    body{
      background:
        linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.58)),
        url("background.png") center center/cover no-repeat;
    }
    .wrap{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
    .content{text-shadow:0 3px 18px rgba(0,0,0,.95)}
    h1{margin:0;font-size:clamp(54px,7vw,112px);letter-spacing:7px;font-weight:900}
    .status{margin-top:14px;font-size:clamp(20px,2vw,34px);font-weight:600}
    .discord{margin-top:18px;font-size:clamp(16px,1.3vw,22px);opacity:.92}
    .discord b{color:#ff3030}
    .bottom{position:fixed;left:5%;right:5%;bottom:5%}
    .bar-bg{height:12px;background:rgba(255,255,255,.18);border-radius:20px;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,.65)}
    .bar{height:100%;width:12%;border-radius:20px;background:#e51b23;box-shadow:0 0 18px rgba(229,27,35,.95);animation:loading 4.5s ease-in-out infinite}
    .hint{text-align:center;margin-top:12px;font-size:14px;letter-spacing:2px;opacity:.75}
    @keyframes loading{
      0%{width:8%}
      45%{width:67%}
      75%{width:88%}
      100%{width:100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="content">
      <h1>NORDLIFE RP</h1>
      <div class="status">Connexion au serveur...</div>
      <div class="discord">Discord : <b>discord.gg/WHhbQDdwg</b></div>
    </div>
  </div>
  <div class="bottom">
    <div class="bar-bg"><div class="bar"></div></div>
    <div class="hint">CHARGEMENT DE NORDLIFE</div>
  </div>
</body>
</html>
